name: ci

on:
  push:
  pull_request:

jobs:
  test-lint-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Route error paths + URL parsing + length guard. No API key involved.
      - run: npm test
      - run: npm run lint
      - run: npm run build
